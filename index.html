*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{background:var(--white);border-bottom:1px solid var(--line);padding:18px}header h1{margin:0;color:var(--accent-dark);font-size:1.5rem;font-weight:750}main{max-width:760px;margin:auto;padding:16px 14px 34px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}.stat span{color:var(--muted);font-size:.9rem;font-weight:650}.stat strong{font-size:1.5rem;color:var(--accent-dark);font-variant-numeric:tabular-nums;white-space:nowrap}.stat small{font-size:.72rem;margin-left:3px;color:var(--muted)}h2{font-size:1.04rem;margin:20px 2px 10px}.panel,.task,.parent-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.field{margin-bottom:13px}.field label{display:block;font-weight:650;font-size:.9rem;margin-bottom:7px}input[type=text]{width:100%;padding:11px 12px;border:1px solid #CBD8D7;border-radius:9px;background:white;color:var(--ink);font:inherit}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.level-btn{border:1px solid #D2E1DF;background:#fff;color:var(--ink);padding:10px 5px;border-radius:9px;font-weight:700;font-size:.85rem}.level-btn[aria-pressed=true]{background:var(--accent-pale);border:2px solid var(--accent-dark);color:var(--accent-dark);padding:9px 4px}button{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8ADFD8;outline-offset:2px}.primary{background:var(--accent-dark);color:white}.secondary{background:var(--accent-pale);color:var(--accent-dark)}.danger{background:#FAE9E7;color:var(--red)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar button{font-size:.88rem}.hint{font-size:.78rem;color:var(--muted);margin:7px 0 0;line-height:1.5}.task-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.task-heading h2{margin-bottom:10px}.task{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}.task-check{width:21px;height:21px;margin-top:3px;accent-color:var(--accent-dark);flex-shrink:0}.taskbody{min-width:0;flex:1}.tasktitle{font-weight:700;overflow-wrap:anywhere}.taskmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{background:var(--accent-pale);color:var(--accent-dark);border-radius:99px;padding:3px 8px;font-size:.77rem}.taskactions{display:flex;gap:6px;margin-top:9px}.taskactions button{padding:6px 9px;font-size:.78rem}.icon-btn{padding:5px 8px;min-width:32px;background:var(--accent-pale);color:var(--accent-dark)}.parent-card{margin-bottom:10px;padding:13px}.parent-head{display:flex;gap:8px;align-items:flex-start}.parent-main{min-width:0;flex:1}.parent-name-row{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.parent-name{font-weight:750;overflow-wrap:anywhere}.parent-points{font-size:.8rem;color:var(--accent-dark);font-weight:750;white-space:nowrap}.progress-line{display:flex;align-items:center;gap:9px;margin-top:7px}.progress-track{height:7px;background:#EAF0EF;border-radius:20px;overflow:hidden;flex:1}.progress-fill{height:100%;background:var(--accent);border-radius:20px}.progress-text{font-size:.76rem;color:var(--muted);white-space:nowrap}.children{margin:10px 0 0 17px;padding-left:12px;border-left:2px solid #E4F3F1}.child-row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #F0F4F3}.child-row:last-child{border-bottom:0}.child-row.done .child-name{text-decoration:line-through;color:var(--muted)}.child-row input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent-dark);flex-shrink:0}.child-content{min-width:0;flex:1}.child-name{font-size:.9rem;font-weight:600;overflow-wrap:anywhere}.child-meta{font-size:.75rem;color:var(--muted);margin-top:3px}.child-actions{display:flex;gap:4px}.child-actions button{padding:4px 7px;font-size:.75rem}.add-child{margin:9px 0 0 17px}.empty{color:var(--muted);text-align:center;padding:22px 10px}.hidden{display:none!important}.backup{margin-top:24px}.backup .hint{line-height:1.6}footer{color:var(--muted);font-size:.78rem;text-align:center;padding:18px 4px 4px;line-height:1.6}.screen{display:none}.screen.active{display:block}.back-btn{margin:2px 0 12px}.date-group{margin:12px 0}.date-toggle{width:100%;text-align:left;background:#EAF4F3;color:var(--ink);display:flex;justify-content:space-between;align-items:center}.history-entry{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.history-entry summary{cursor:pointer;font-weight:700}.history-entry .taskactions{margin-top:10px}.history-child{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #EFF3F2;font-size:.88rem}.history-child:last-child{border:0}.modal-backdrop{position:fixed;inset:0;background:#15252566;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(100%,440px);background:white;border-radius:16px;padding:18px;box-shadow:0 12px 40px #0002}.modal h3{margin:0 0 14px}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions button{flex:1}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263536;color:white;padding:9px 14px;border-radius:99px;font-size:.85rem;z-index:20}.star-particle{position:fixed;z-index:9999;pointer-events:none;width:10px;height:10px;opacity:0;color:var(--accent);font-size:12px;line-height:1;animation:star-pop .72s cubic-bezier(.16,.72,.28,1) forwards;will-change:transform,opacity}.star-particle:before{content:"★"}.star-particle.gold{color:var(--yellow)}@keyframes star-pop{0%{opacity:0;transform:translate(0,0) scale(.25) rotate(0deg)}18%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1) rotate(35deg)}100%{opacity:0;transform:translate(calc(var(--dx)*1.55),calc(var(--dy)*1.55)) scale(.35) rotate(115deg)}}@media(prefers-reduced-motion:reduce){.star-particle{animation-duration:.01ms}}.hidden{display:none!important}@media(min-width:600px){header{padding-left:max(18px,calc((100% - 730px)/2));padding-right:max(18px,calc((100% - 730px)/2))}main{padding-top:22px}.panel{padding:18px}}
</style>

<body>
<header><h1>▸ Daily Quest</h1></header>
<main>
<section id="mainScreen" class="screen active">
  <div class="stats"><div class="stat"><span>未完了タスク</span><strong><span id="openTaskTotal">0</span><small>件</small></strong></div><div class="stat"><span>実績</span><strong><span id="achievementTotal">0</span><small>pt</small></strong></div></div>
  <h2 id="formHeading">＋ タスクを追加</h2>
  <form id="taskForm" class="panel">
    <input id="editId" type="hidden">
    <div class="field"><label for="taskName">タスク名</label><input id="taskName" type="text" maxlength="50" placeholder="タスクを入力" required></div>
    <div class="field"><label>行動ポイント</label><div class="levels" id="challengeLevels" role="group" aria-label="行動ポイント"><button class="level-btn" type="button" data-value="1" aria-pressed="true">1：10分以内</button><button class="level-btn" type="button" data-value="2" aria-pressed="false">2：1時間以内</button><button class="level-btn" type="button" data-value="3" aria-pressed="false">3：それ以上</button></div></div>
    <div class="toolbar"><button class="primary" type="submit" id="saveBtn" style="flex:1">タスクを追加</button></div>
  </form>
  <div class="task-heading"><h2>タスク</h2></div>
  <div id="openTasks"></div>
  <div class="toolbar" style="margin-top:22px"><button class="secondary" id="historyScreenBtn" type="button" style="width:100%">完了履歴を見る</button></div>
  <section class="backup"><h2>バックアップ</h2><div class="panel"><p class="hint">データはこのブラウザ内に保存されます。端末の故障やブラウザのデータ消去に備えて、定期的に保存してください。別端末には自動同期されません。</p><div class="toolbar"><button class="secondary" id="exportBtn" type="button">書き出す</button><button class="secondary" id="importBtn" type="button">読み込む</button><input class="hidden" id="importFile" type="file" accept=".json,application/json"></div></div></section>
  <footer>Daily Quest</footer>
</section>
<section id="historyScreen" class="screen"><button class="secondary back-btn" id="backMain" type="button">← メイン画面へ戻る</button><h2>完了履歴</h2><div id="historyGroups"></div></section>
</main>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='lifeImprovementTasks.v1';
let tasks=[],retainedAchievement=0,challenge=1,editing=null,editingTarget=null,toastTimer=null;
const $=id=>document.getElementById(id);
const now=()=>new Date().toISOString();
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
function level(v){const n=Number(v)||1;return Math.max(1,Math.min(3,Math.round(n)));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateKey(v){const d=new Date(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateLabel(key){const [y,m,d]=key.split('-').map(Number);return `${y}年${m}月${d}日`;}
function stamp(v){return v?new Date(v).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';}
function childPoints(p){return (p.children||[]).reduce((s,c)=>s+Number(c.difficulty||1),0);}
function parentDone(p){return !!p.completedAt;}
function isParent(t){return Array.isArray(t.children);}
function achievement(){let n=Number(retainedAchievement)||0;for(const t of tasks){if(isParent(t)){for(const c of t.children)if(c.completedAt)n+=Number(c.difficulty)||1;}else if(t.completedAt)n+=Number(t.difficulty)||1;}return n;}
function normalizeTask(t){const base={id:String(t.id||uid()),name:String(t.name||'').trim().slice(0,50),createdAt:t.createdAt||now()};if(Array.isArray(t.children)){const children=t.children.map(c=>({id:String(c.id||uid()),name:String(c.name||'').trim().slice(0,50),difficulty:level(c.difficulty),createdAt:c.createdAt||now(),completedAt:c.completedAt||null})).filter(c=>c.name);return {...base,children,completedAt:t.completedAt||null,manualReopen:!!t.manualReopen};}return {...base,difficulty:t.difficulty==null?null:level(t.difficulty),completedAt:t.completedAt||null};}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw)){tasks=raw.map(normalizeTask).filter(t=>t.name);}else if(raw&&Array.isArray(raw.tasks)){tasks=raw.tasks.map(normalizeTask).filter(t=>t.name);retainedAchievement=Number(raw.retainedAchievement)||0;}else tasks=[];}catch(e){tasks=[];retainedAchievement=0;}saveData();}
function saveData(){localStorage.setItem(KEY,JSON.stringify({version:3,retainedAchievement,tasks}));}
function persist(){saveData();render();}
function setLevel(v){challenge=Number(v);$('challengeLevels').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.value)===challenge)));}
$('challengeLevels').addEventListener('click',e=>{const b=e.target.closest('button[data-value]');if(b)setLevel(b.dataset.value);});
function sortTasks(arr){return arr.sort((a,b)=>displayPoints(a)-displayPoints(b)||new Date(a.createdAt)-new Date(b.createdAt));}
function displayPoints(t){return isParent(t)?childPoints(t):(Number(t.difficulty)||1);}
function childSort(a,b){return Number(!!a.completedAt)-Number(!!b.completedAt)||Number(a.difficulty)-Number(b.difficulty)||new Date(a.createdAt)-new Date(b.createdAt);}
function taskCard(t){return `<article class="task"><input class="task-check" type="checkbox" ${t.difficulty==null?'disabled':''} aria-label="完了にする" onchange="completeTask('${esc(t.id)}',this.checked,this)"><div class="taskbody"><div class="tasktitle">${esc(t.name)}</div><div class="taskmeta"><span class="pill">${t.difficulty==null?'行動ポイント未設定':'行動ポイント '+t.difficulty+'/3'}</span></div></div><div class="taskactions"><button class="icon-btn" type="button" title="編集" aria-label="編集" onclick="editTask('${esc(t.id)}')">✎</button><button class="icon-btn" type="button" title="サブタスクを追加" aria-label="サブタスクを追加" onclick="openChildEditor('${esc(t.id)}')">＋</button><button class="danger" type="button" onclick="deleteTask('${esc(t.id)}')">削除</button></div></article>`;}
function parentCard(p){const kids=[...(p.children||[])].sort(childSort),done=kids.filter(c=>c.completedAt).length,total=kids.length,pts=childPoints(p),pct=total?Math.round(done/total*100):0;return `<article class="parent-card"><div class="parent-head"><div class="parent-main"><div class="parent-name-row"><div class="parent-name">${esc(p.name)}</div><div class="parent-points">合計 ${pts}pt</div></div><div class="progress-line"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-text">${done}/${total}（${pct}%）</div></div></div><div class="taskactions" style="margin:0"><button class="icon-btn" type="button" title="編集" aria-label="親タスクを編集" onclick="editTask('${esc(p.id)}')">✎</button><button class="danger" type="button" onclick="deleteTask('${esc(p.id)}')">削除</button></div></div><div class="children">${kids.map(c=>`<div class="child-row ${c.completedAt?'done':''}"><input type="checkbox" ${c.completedAt?'checked':''} aria-label="${c.completedAt?'未完了に戻す':'完了にする'}" onchange="toggleChild('${esc(p.id)}','${esc(c.id)}',this.checked,this)"><div class="child-content"><div class="child-name">${esc(c.name)}</div><div class="child-meta">行動ポイント ${c.difficulty}pt ${c.completedAt?'・完了 '+stamp(c.completedAt):''}</div></div><div class="child-actions"><button class="icon-btn" type="button" title="編集" onclick="editChild('${esc(p.id)}','${esc(c.id)}')">✎</button><button class="danger" type="button" onclick="deleteChild('${esc(p.id)}','${esc(c.id)}')">削除</button></div></div>`).join('')}</div><div class="add-child"><button class="secondary" type="button" onclick="openChildEditor('${esc(p.id)}')">＋ サブタスクを追加</button></div></article>`;}
function render(){const open=tasks.filter(t=>isParent(t)?(!t.completedAt||t.manualReopen):!t.completedAt);sortTasks(open);const count=open.reduce((n,t)=>n+(isParent(t)?t.children.filter(c=>!c.completedAt).length:1),0);$('openTaskTotal').textContent=count;$('achievementTotal').textContent=achievement();$('openTasks').innerHTML=open.length?open.map(t=>isParent(t)?parentCard(t):taskCard(t)).join(''):'<div class="empty">未完了タスクはありません。</div>';renderHistory();}
function resetForm(){editing=null;$('editId').value='';$('taskName').value='';setLevel(1);$('formHeading').textContent='＋ タスクを追加';$('saveBtn').textContent='タスクを追加';}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const name=$('taskName').value.trim();if(!name){$('taskName').focus();return;}tasks.push({id:uid(),name,difficulty:challenge,createdAt:now(),completedAt:null});setLevel(1);persist();$('taskName').blur();});
window.editTask=id=>{const t=tasks.find(x=>x.id===id);if(!t)return;const parent=isParent(t);showModal(`<h3>${parent?'親タスク':'タスク'}を編集</h3><div class="field"><label for="modalName">タスク名</label><input id="modalName" type="text" maxlength="50" value="${esc(t.name)}"></div>${parent?'':'<div class="field"><label>行動ポイント</label><div class="levels" id="modalLevels"><button type="button" class="level-btn" data-v="1">1</button><button type="button" class="level-btn" data-v="2">2</button><button type="button" class="level-btn" data-v="3">3</button></div></div>'}<p class="hint">変更内容は自動で保存されます。</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">閉じる</button></div>`);const input=$('modalName');input.addEventListener('input',()=>{const v=input.value.trim();if(v){t.name=v;persist();}});input.addEventListener('blur',()=>{const v=input.value.trim();if(v){t.name=v;input.value=v;persist();}});if(!parent){const root=$('modalLevels');root.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(t.difficulty!=null&&Number(b.dataset.v)===Number(t.difficulty))));root.onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;t.difficulty=Number(b.dataset.v);root.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));persist();};}input.focus();};
window.completeTask=(id,checked,control)=>{const t=tasks.find(x=>x.id===id);if(!t||isParent(t)||t.difficulty==null)return;if(checked)starBurst(control);t.completedAt=checked?now():null;persist();};
window.toggleChild=(pid,cid,checked,control)=>{const p=tasks.find(x=>x.id===pid),c=p?.children?.find(x=>x.id===cid);if(!p||!c)return;if(checked)starBurst(control);c.completedAt=checked?now():null;p.manualReopen=false;p.completedAt=p.children.length&&p.children.every(x=>x.completedAt)?latestChildDate(p):null;persist();};
function latestChildDate(p){return p.children.map(c=>c.completedAt).filter(Boolean).sort().at(-1)||now();}
function starBurst(control){if(!control)return;const r=control.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const particles=[[-17,-17,false,0],[18,-16,true,25],[-20,8,true,45],[20,9,false,15],[0,-25,false,35]];particles.forEach(([dx,dy,gold,delay])=>{const star=document.createElement('span');star.className='star-particle'+(gold?' gold':'');star.style.left=`${cx-5}px`;star.style.top=`${cy-5}px`;star.style.setProperty('--dx',`${dx}px`);star.style.setProperty('--dy',`${dy}px`);star.style.animationDelay=`${delay}ms`;document.body.appendChild(star);star.addEventListener('animationend',()=>star.remove(),{once:true});});}
window.openChildEditor=pid=>{const p=tasks.find(x=>x.id===pid);if(!p)return;showModal(`<h3>サブタスクを追加</h3><div class="field"><label for="modalName">サブタスク名</label><input id="modalName" type="text" maxlength="50" placeholder="サブタスクを入力"></div><div class="field"><label>行動ポイント</label><div class="levels" id="modalLevels"><button type="button" class="level-btn" data-v="1" aria-pressed="true">1</button><button type="button" class="level-btn" data-v="2" aria-pressed="false">2</button><button type="button" class="level-btn" data-v="3" aria-pressed="false">3</button></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">閉じる</button><button class="primary" onclick="addChild('${esc(pid)}')">追加</button></div>`);let v=1;$('modalLevels').onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;v=Number(b.dataset.v);$('modalLevels').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};$('modalName').focus();window._modalChildLevel=()=>v;};
window.addChild=pid=>{const p=tasks.find(x=>x.id===pid),name=$('modalName')?.value.trim();if(!p||!name){$('modalName')?.focus();return;}if(!isParent(p)){const oldDone=!!p.completedAt;if(oldDone){p.completedAt=null;retainedAchievement+=0;}p.children=[];delete p.difficulty;delete p.priority;delete p.manualReopen;}p.children.push({id:uid(),name,difficulty:window._modalChildLevel(),createdAt:now(),completedAt:null});p.completedAt=null;p.manualReopen=false;closeModal();persist();};
window.editChild=(pid,cid)=>{const p=tasks.find(x=>x.id===pid),c=p?.children?.find(x=>x.id===cid);if(!c)return;showModal(`<h3>サブタスクを編集</h3><div class="field"><label for="modalName">サブタスク名</label><input id="modalName" type="text" maxlength="50" value="${esc(c.name)}"></div><div class="field"><label>行動ポイント</label><div class="levels" id="modalLevels"><button type="button" class="level-btn" data-v="1">1</button><button type="button" class="level-btn" data-v="2">2</button><button type="button" class="level-btn" data-v="3">3</button></div></div><p class="hint">変更内容は自動で保存されます。</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">閉じる</button></div>`);const input=$('modalName');input.addEventListener('input',()=>{const v=input.value.trim();if(v){c.name=v;persist();}});input.addEventListener('blur',()=>{const v=input.value.trim();if(v){c.name=v;input.value=v;persist();}});const root=$('modalLevels');root.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.v)===Number(c.difficulty))));root.onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;c.difficulty=Number(b.dataset.v);root.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));p.completedAt=p.children.every(x=>x.completedAt)?latestChildDate(p):null;persist();};input.focus();};
window.deleteChild=(pid,cid)=>{const p=tasks.find(x=>x.id===pid),c=p?.children?.find(x=>x.id===cid);if(!p||!c)return;if(!confirm(`サブタスク「${c.name}」を削除しますか？${c.completedAt?'\n獲得した実績ポイントは差し引かれます。':''}`))return;p.children=p.children.filter(x=>x.id!==cid);if(!p.children.length){p.difficulty=null;p.completedAt=null;delete p.children;delete p.manualReopen;persist();alert('親タスクは通常タスクに戻りました。行動ポイントを再設定してください。');editTask(p.id);return;}else{p.completedAt=p.children.every(x=>x.completedAt)?latestChildDate(p):null;p.manualReopen=false;}persist();};
window.deleteTask=id=>{const t=tasks.find(x=>x.id===id);if(!t)return;const msg=isParent(t)?`この親タスクとサブタスク${t.children.length}件が削除されます。`:'このタスクを削除しますか？';if(!confirm(msg))return;if(isParent(t)){retainedAchievement+=t.children.reduce((s,c)=>s+(c.completedAt?(Number(c.difficulty)||1):0),0);}tasks=tasks.filter(x=>x.id!==id);if(editing===id)resetForm();persist();};
function showModal(html){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
window.closeModal=()=>{$('modalRoot').innerHTML='';};
$('historyScreenBtn').onclick=()=>{$('mainScreen').classList.remove('active');$('historyScreen').classList.add('active');window.scrollTo(0,0);renderHistory();};$('backMain').onclick=()=>{$('historyScreen').classList.remove('active');$('mainScreen').classList.add('active');window.scrollTo(0,0);};
function historyEntry(t){if(isParent(t)){const kids=[...t.children].sort((a,b)=>new Date(a.completedAt||0)-new Date(b.completedAt||0));return `<details class="history-entry"><summary>${esc(t.name)}　${kids.filter(c=>c.completedAt).length}/${kids.length} 完了　合計 ${childPoints(t)}pt <span style="font-size:.75rem;color:var(--muted);font-weight:400">${stamp(t.completedAt)}</span></summary>${kids.map(c=>`<div class="history-child"><span>${c.completedAt?'✓':'○'}</span><span style="flex:1">${esc(c.name)}　${c.difficulty}pt</span><small>${c.completedAt?stamp(c.completedAt):'未完了'}</small>${c.completedAt?`<button class="secondary" onclick="undoChildFromHistory('${esc(t.id)}','${esc(c.id)}')">取り消す</button>`:''}</div>`).join('')}<div class="taskactions"><button class="icon-btn" title="編集" onclick="editTask('${esc(t.id)}')">✎</button><button class="secondary" onclick="undoParentFromHistory('${esc(t.id)}')">親タスクを再開</button><button class="danger" onclick="deleteTask('${esc(t.id)}')">削除</button></div></details>`;}return `<div class="history-entry"><div style="font-weight:700">${esc(t.name)}</div><div class="taskmeta"><span class="pill">${t.difficulty}pt</span><span class="pill">完了 ${stamp(t.completedAt)}</span></div><div class="taskactions"><button class="icon-btn" title="編集" onclick="editTask('${esc(t.id)}')">✎</button><button class="secondary" onclick="undoTaskFromHistory('${esc(t.id)}')">未完了に戻す</button><button class="danger" onclick="deleteTask('${esc(t.id)}')">削除</button></div></div>`;}
function renderHistory(){const done=tasks.filter(t=>isParent(t)?!!t.completedAt:!!t.completedAt);const groups={};for(const t of done){const k=dateKey(t.completedAt);(groups[k]??=[]).push(t);}const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a)),today=dateKey(now());$('historyGroups').innerHTML=keys.length?keys.map(k=>`<details class="date-group" ${k===today?'open':''}><summary class="date-toggle">${dateLabel(k)} <span>${groups[k].length}件　${k===today?'▼':'＋'}</span></summary>${groups[k].sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt)).map(historyEntry).join('')}</details>`).join(''):'<div class="empty">完了履歴はまだありません。</div>';}
window.undoTaskFromHistory=id=>{const t=tasks.find(x=>x.id===id);if(!t||isParent(t))return;if(!confirm(`「${t.name}」を未完了に戻します。実績が${t.difficulty}pt減少します。よろしいですか？`))return;t.completedAt=null;persist();};
window.undoChildFromHistory=(pid,cid)=>{const p=tasks.find(x=>x.id===pid),c=p?.children?.find(x=>x.id===cid);if(!c||!c.completedAt)return;if(!confirm(`「${c.name}」を未完了に戻します。実績が${c.difficulty}pt減少します。よろしいですか？`))return;c.completedAt=null;p.completedAt=null;p.manualReopen=false;persist();};
window.undoParentFromHistory=id=>{const p=tasks.find(x=>x.id===id);if(!p||!isParent(p))return;if(!confirm(`「${p.name}」を再開します。完了済みサブタスクの状態と実績は保持します。よろしいですか？`))return;p.completedAt=null;p.manualReopen=true;persist();};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:3,exportedAt:now(),retainedAchievement,tasks},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daily_quest_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),incoming=Array.isArray(data)?data:data.tasks;if(!Array.isArray(incoming))throw new Error('invalid');if(!confirm('現在のタスクをバックアップの内容で置き換えますか？'))return;tasks=incoming.map(normalizeTask).filter(t=>t.name);retainedAchievement=Number(data.retainedAchievement)||0;persist();resetForm();alert('バックアップを読み込みました。');}catch(err){alert('読み込めませんでした。有効なバックアップJSONを選んでください。');}finally{e.target.value='';}};
load();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
