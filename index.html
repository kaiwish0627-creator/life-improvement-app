ze:.88rem}.hint{font-size:.78rem;color:var(--muted);margin:7px 0 0;line-height:1.5}.task-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.task-heading h2{margin-bottom:10px}.task{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}.task-check{width:21px;height:21px;margin-top:3px;accent-color:var(--accent);flex-shrink:0}.taskbody{min-width:0;flex:1}.tasktitle{font-weight:700;overflow-wrap:anywhere}.task-title-row,.child-title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.point-dot{display:inline-flex;align-items:baseline;justify-content:center;gap:2px;min-height:29px;padding:4px 10px;border-radius:999px;background:var(--accent-pale);color:var(--accent-dark);line-height:1;flex-shrink:0;white-space:nowrap}.point-dot .point-number{font-size:18px;font-weight:750}.point-dot .point-unit{font-size:11px;font-weight:600}.taskmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{background:var(--accent-pale);color:var(--accent-dark);border-radius:99px;padding:3px 8px;font-size:.77rem}.taskactions{display:flex;gap:6px;margin-top:9px}.taskactions button{padding:6px 9px;font-size:.78rem}.icon-btn{padding:5px 8px;min-width:32px;background:var(--accent-pale);color:var(--accent-dark)}.parent-card{margin-bottom:10px;padding:13px}.parent-head{display:flex;gap:8px;align-items:flex-start}.parent-main{min-width:0;flex:1}.parent-name-row{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.parent-name{font-weight:750;overflow-wrap:anywhere}.parent-points{font-size:.8rem;color:var(--accent-dark);font-weight:750;white-space:nowrap}.progress-line{display:flex;align-items:center;gap:9px;margin-top:7px}.progress-track{height:7px;background:#EAF0EF;border-radius:20px;overflow:hidden;flex:1}.progress-fill{height:100%;background:var(--accent);border-radius:20px}.progress-text{font-size:.76rem;color:var(--muted);white-space:nowrap}.children{margin:10px 0 0 17px;padding-left:12px;border-left:2px solid #E4F3F1}.child-row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #F0F4F3}.child-row:last-child{border-bottom:0}.child-row.done .child-name{text-decoration:line-through;color:var(--muted)}.child-row input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}.child-content{min-width:0;flex:1}.child-name{font-size:.9rem;font-weight:600;overflow-wrap:anywhere}.child-meta{font-size:.75rem;color:var(--muted);margin-top:3px}.child-actions{display:flex;gap:4px}.child-actions button{padding:4px 7px;font-size:.75rem}.add-child{margin:9px 0 0 17px}.empty{color:var(--muted);text-align:center;padding:22px 10px}.hidden{display:none!important}.backup{margin-top:24px}.backup .hint{line-height:1.6}footer{color:var(--muted);font-size:.78rem;text-align:center;padding:18px 4px 4px;line-height:1.6}.screen{display:none}.screen.active{display:block}.back-btn{margin:2px 0 12px}.date-group{margin:12px 0}.date-toggle{width:100%;text-align:left;background:#EAF4F3;color:var(--ink);display:flex;justify-content:space-between;align-items:center}.history-entry{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.history-entry summary{cursor:pointer;font-weight:700}.history-entry .taskactions{margin-top:10px}.history-child{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #EFF3F2;font-size:.88rem}.history-child:last-child{border:0}.modal-backdrop{position:fixed;inset:0;background:#15252566;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(100%,440px);background:white;border-radius:16px;padding:18px;box-shadow:0 12px 40px #0002}.modal h3{margin:0 0 14px}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions button{flex:1}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263536;color:white;padding:9px 14px;border-radius:99px;font-size:.85rem;z-index:20}.star-particle{position:fixed;z-index:9999;pointer-events:none;width:10px;height:10px;opacity:0;color:var(--accent);font-size:12px;line-height:1;animation:star-pop .72s cubic-bezier(.16,.72,.28,1) forwards;will-change:transform,opacity}.star-particle:before{content:"★"}.star-particle.gold{color:var(--yellow)}@keyframes star-pop{0%{opacity:0;transform:translate(0,0) scale(.25) rotate(0deg)}18%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1) rotate(35deg)}100%{opacity:0;transform:translate(calc(var(--dx)*1.55),calc(var(--dy)*1.55)) scale(.35) rotate(115deg)}}@media(prefers-reduced-motion:reduce){.star-particle{animation-duration:.01ms}}.hidden{display:none!important}@media(min-width:600px){header{padding-left:max(18px,calc((100% - 730px)/2));padding-right:max(18px,calc((100% - 730px)/2))}main{padding-top:22px}.panel{padding:18px}}

/* Checked state uses Miku turquoise even while completion animation runs. */
.task-check, .child-row input[type="checkbox"] {appearance:none;-webkit-appearance:none;display:inline-grid;place-content:center;background:#fff;border:2px solid #8AA5A2;border-radius:5px;cursor:pointer;}
.task-check:checked, .child-row input[type="checkbox"]:checked {background:#39C5BB;border-color:#39C5BB;opacity:1;}
.task-check:checked::before, .child-row input[type="checkbox"]:checked::before {content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg);}
.task-check:disabled, .child-row input[type="checkbox"]:disabled {cursor:not-allowed;opacity:.45;}
/* Stable bottom navigation and on-demand task entry. */
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{padding-bottom:32px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding:7px max(12px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 18px #2635360a}
.nav-btn{flex:1;max-width:250px;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;color:var(--muted);padding:5px 8px;font-size:.77rem;border-radius:10px}
.nav-btn.active{color:var(--accent-dark);background:var(--accent-pale)}
.nav-icon{font-size:1.35rem;line-height:1.3}
.add-main-btn{border-radius:50%;width:43px;height:43px;font-size:1.65rem;line-height:1;padding:0;flex-shrink:0}
#addTaskOverlay{z-index:12}#addTaskOverlay .modal{max-height:calc(100dvh - 36px);overflow-y:auto}
#addTaskOverlay .modal h3{margin-bottom:16px}

.type-switch{display:flex;gap:6px;background:#eaf3f2;padding:5px;border-radius:12px;margin:10px 0 14px}.type-switch button{flex:1;background:transparent;color:var(--muted)}.type-switch button.selected{background:white;color:var(--accent-dark);box-shadow:0 1px 5px #0001}select{width:100%;padding:11px;border:1px solid #CBD8D7;border-radius:9px;background:#fff;font:inherit}.template-item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.template-item:last-child{border:0}.template-item span{font-size:.8rem;color:var(--muted)}
.weekday-buttons{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;justify-items:center}.weekday-buttons button{display:grid;place-items:center;width:min(100%,40px);aspect-ratio:1;padding:0;border:1px solid #d5e4e2;background:#f2f6f5;color:#657573;border-radius:50%;font-weight:700;min-width:0}.weekday-buttons button.selected{background:var(--accent-pale);color:var(--accent-dark);border:2.5px solid #15958D}.danger:has(svg){display:inline-flex;align-items:center;justify-content:center;min-width:34px;min-height:32px;padding:6px 8px}.weekday-buttons button:focus-visible{outline:2px solid #168f88;outline-offset:2px}

.history-achievement{background:#eaf3f2;border-radius:14px;padding:16px 18px;margin:12px 0 20px}.history-achievement-label{font-size:.86rem;color:var(--muted);font-weight:650}.history-achievement-value{display:flex;align-items:baseline;gap:5px;color:var(--accent-dark);margin-top:4px}.history-achievement-value strong{font-size:2rem;font-weight:750;font-variant-numeric:tabular-nums}.history-achievement-value span{font-size:.9rem;font-weight:650}
.parent-add-circle{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;min-width:29px;border-radius:50%;padding:0;background:var(--accent-pale);color:var(--accent-dark);font-size:21px;font-weight:600;line-height:1;flex-shrink:0}.parent-add-circle:hover{filter:brightness(.97)}
.type-switch button{display:flex;align-items:center;justify-content:center;gap:9px}.tab-count{display:inline-flex;min-width:23px;height:23px;padding:0 6px;align-items:center;justify-content:center;border-radius:99px;background:#dce9e7;color:#586c69;font-size:13px;font-weight:700}.type-switch button.selected .tab-count{background:#def5f2;color:#128d85}</style>

<body>
<header><h1>▸ Daily Quest</h1></header>
<main>
<section id="mainScreen" class="screen active">
  <div class="task-heading"><h2>タスク</h2><button class="primary add-main-btn" id="openAddTask" type="button" aria-label="タスクを追加">＋</button></div>
  <div id="addTaskOverlay" class="modal-backdrop hidden" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="formHeading"><h3 id="formHeading">＋ タスクを追加</h3>
  <form id="taskForm">
    <input id="editId" type="hidden">
    <div class="field"><label for="taskName">タスク名</label><input id="taskName" type="text" maxlength="50" placeholder="タスクを入力" required></div>
    <div class="field"><label>行動ポイント</label><div class="levels" id="challengeLevels" role="group" aria-label="行動ポイント"><button class="level-btn" type="button" data-value="1" aria-pressed="true">1：10分以内</button><button class="level-btn" type="button" data-value="2" aria-pressed="false">2：1時間以内</button><button class="level-btn" type="button" data-value="3" aria-pressed="false">3：それ以上</button></div></div>
    <div class="field"><label for="repeatMode">繰り返し</label><select id="repeatMode"><option value="none">繰り返さない（スポット）</option><option value="monthly">毎月（スポット）</option><option value="daily">毎日（ルーティン）</option><option value="weekly">毎週（ルーティン）</option></select></div><div class="field hidden" id="monthTargetField"><label>対象月</label><p class="hint">タスク名に付ける月を選択</p><div class="levels" id="monthTargetLevels" role="group" aria-label="対象月"><button type="button" class="level-btn" data-offset="0" aria-pressed="true">当月</button><button type="button" class="level-btn" data-offset="-1" aria-pressed="false">前月</button></div><p class="hint">登録例：<strong id="monthNamePreview"></strong></p></div><div class="field hidden" id="weekdayField"><label>曜日（複数選択可）</label><div id="weekdayButtons" class="weekday-buttons" role="group" aria-label="繰り返す曜日"><button type="button" data-day="1">月</button><button type="button" data-day="2">火</button><button type="button" data-day="3">水</button><button type="button" data-day="4">木</button><button type="button" data-day="5">金</button><button type="button" data-day="6">土</button><button type="button" data-day="0">日</button></div></div><div class="modal-actions"><button class="secondary" type="button" id="cancelAddTask">キャンセル</button><button class="primary" type="submit" id="saveBtn">タスクを追加</button></div>
  </form></div></div>
  <div class="type-switch" role="group" aria-label="タスク分類"><button id="spotTab" class="selected" type="button">スポット <span class="tab-count" id="spotCount">0</span></button><button id="routineTab" type="button">ルーティン <span class="tab-count" id="routineCount">0</span></button></div><div id="openTasks"></div>
</section>
<section id="settingsScreen" class="screen"><h2>設定</h2>
  <section><h2>繰り返し管理</h2><div id="templateList" class="panel"></div></section><section class="backup"><h2>バックアップ</h2><div class="panel"><p class="hint">データはこのブラウザ内に保存されます。端末の故障やブラウザのデータ消去に備えて、定期的に保存してください。別端末には自動同期されません。</p><div class="toolbar"><button class="secondary" id="exportBtn" type="button">書き出す</button><button class="secondary" id="importBtn" type="button">読み込む</button><input class="hidden" id="importFile" type="file" accept=".json,application/json"></div></div></section>
  <footer>Daily Quest</footer>
</section>
<section id="historyScreen" class="screen"><h2>履歴</h2><div class="history-achievement"><div class="history-achievement-label">累計実績</div><div class="history-achievement-value"><strong id="achievementTotal">0</strong><span>pt</span></div></div><h2>完了履歴</h2><div id="historyGroups"></div></section>
<nav class="bottom-nav" aria-label="画面切り替え"><button type="button" class="nav-btn active" data-screen="mainScreen" aria-current="page"><span class="nav-icon">☑</span><span>タスク</span></button><button type="button" class="nav-btn" data-screen="historyScreen"><span class="nav-icon">◷</span><span>履歴</span></button><button type="button" class="nav-btn" data-screen="settingsScreen"><span class="nav-icon">⚙</span><span>設定</span></button></nav>
</main>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='lifeImprovementTasks.v1';
let tasks=[],templates=[],activeType="spot",retainedAchievement=0,challenge=1,editing=null,editingTarget=null,toastTimer=null;
const $=id=>document.getElementById(id);
const now=()=>new Date().toISOString();
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
function level(v){const n=Number(v)||1;return Math.max(1,Math.min(3,Math.round(n)));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateKey(v){const d=new Date(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateLabel(key){const [y,m,d]=key.split('-').map(Number);return `${y}年${m}月${d}日`;}
function stamp(v){return v?new Date(v).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';}
function childPoints(p){return (p.children||[]).reduce((s,c)=>s+Number(c.difficulty||1),0);}
function remainingChildPoints(p){return (p.children||[]).filter(c=>!c.completedAt).reduce((s,c)=>s+Number(c.difficulty||1),0);}
function parentDone(p){return !!p.completedAt;}
function isParent(t){return Array.isArray(t.children);}
function achievement(){let n=Number(retainedAchievement)||0;for(const t of tasks){if(isParent(t)){for(const c of t.children)if(c.completedAt)n+=Number(c.difficulty)||1;}else if(t.completedAt)n+=Number(t.difficulty)||1;}return n;}
function normalizeTask(t){const base={id:String(t.id||uid()),name:String(t.name||'').trim().slice(0,50),createdAt:t.createdAt||now(),type:t.type==='routine'?'routine':'spot',templateId:t.templateId||null,occurrenceKey:t.occurrenceKey||null};if(Array.isArray(t.children)){const children=t.children.map(c=>({id:String(c.id||uid()),name:String(c.name||'').trim().slice(0,50),difficulty:level(c.difficulty),createdAt:c.createdAt||now(),completedAt:c.completedAt||null})).filter(c=>c.name);return {...base,children,completedAt:t.completedAt||null,manualReopen:!!t.manualReopen};}return {...base,difficulty:t.difficulty==null?null:level(t.difficulty),completedAt:t.completedAt||null};}
function localDay(){return dateKey(new Date());}
function monthKey(day){return day.slice(0,7);}
function targetMonthName(name,month,offset){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+(offset===-1?-1:0),1);return `${d.getMonth()+1}月の${name}`;}
function templateLabel(t){return t.repeat==='daily'?'毎日':t.repeat==='weekly'?'毎週 '+(t.weekdays||[t.weekday]).map(d=>['日','月','火','水','木','金','土'][d]).join('・')+'曜日':'毎月';}
function syncRepeats(){
 const day=localDay(),month=monthKey(day),weekday=new Date(day+'T12:00:00').getDay();let changed=false;
 // Expired routine occurrences never become history and never earn points.
 const before=tasks.length;tasks=tasks.filter(t=>t.type!=='routine'||!!t.completedAt||t.occurrenceKey===day);if(before!==tasks.length)changed=true;
 for(const t of templates){
  if(t.repeat==='weekly'&&!(t.weekdays||[t.weekday]).map(Number).includes(weekday))continue;
  const key=t.repeat==='monthly'?month:day;
  if(t.repeat==='monthly'||t.repeat==='daily'||t.repeat==='weekly'){
   if(key<(t.startKey||key))continue;
   if(!(t.generatedKeys||[]).includes(key)&&!tasks.some(x=>x.templateId===t.id&&x.occurrenceKey===key)){
    tasks.push({id:uid(),name:t.repeat==='monthly'?targetMonthName(t.name,month,t.monthOffset):t.name,difficulty:t.difficulty,createdAt:now(),completedAt:null,type:t.repeat==='monthly'?'spot':'routine',templateId:t.id,occurrenceKey:key});(t.generatedKeys??=[]).push(key);changed=true;
   }
  }
 }
 if(changed)saveData();
}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw)){tasks=raw.map(normalizeTask).filter(t=>t.name);}else if(raw&&Array.isArray(raw.tasks)){tasks=raw.tasks.map(normalizeTask).filter(t=>t.name);templates=Array.isArray(raw.templates)?raw.templates.filter(x=>x&&["monthly","daily","weekly"].includes(x.repeat)).map(x=>({id:String(x.id||uid()),name:String(x.name||"").slice(0,50),difficulty:level(x.difficulty),repeat:x.repeat,weekday:Number(x.weekday)||0,weekdays:Array.isArray(x.weekdays)?[...new Set(x.weekdays.map(Number).filter(d=>Number.isInteger(d)&&d>=0&&d<=6))]:[Number(x.weekday)||0],startKey:String(x.startKey||""),monthOffset:x.monthOffset===-1?-1:0,generatedKeys:Array.isArray(x.generatedKeys)?x.generatedKeys:[]})).filter(x=>x.name):[];retainedAchievement=Number(raw.retainedAchievement)||0;}else tasks=[];}catch(e){tasks=[];retainedAchievement=0;}syncRepeats();saveData();}
function saveData(){localStorage.setItem(KEY,JSON.stringify({version:4,retainedAchievement,tasks,templates}));}
function persist(){saveData();render();}
function setLevel(v){challenge=Number(v);$('challengeLevels').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.value)===challenge)));}
$('challengeLevels').addEventListener('click',e=>{const b=e.target.closest('button[data-value]');if(b)setLevel(b.dataset.value);});
function sortTasks(arr){return arr.sort((a,b)=>displayPoints(a)-displayPoints(b)||new Date(a.createdAt)-new Date(b.createdAt));}
function displayPoints(t){return isParent(t)?childPoints(t):(Number(t.difficulty)||1);}
function childSort(a,b){return Number(!!a.completedAt)-Number(!!b.completedAt)||Number(a.difficulty)-Number(b.difficulty)||new Date(a.createdAt)-new Date(b.createdAt);}

   if(t.completedAt){add(t.completedAt,historyEntry(t));}
   else for(const c of t.children){if(!c.completedAt)continue;
    add(c.completedAt,`<div class="history-entry"><div style="font-weight:700">${esc(t.name)} / ${esc(c.name)}</div><div class="taskmeta"><span class="pill">${c.difficulty}pt</span><span class="pill">完了 ${stamp(c.completedAt)}</span></div><div class="taskactions"><button class="secondary" data-action="undo-child" data-parent-id="${esc(t.id)}" data-child-id="${esc(c.id)}">取り消す</button></div></div>`);
   }
  }else if(t.completedAt)add(t.completedAt,historyEntry(t));
 }
 const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a)),today=dateKey(now());
 $('historyGroups').innerHTML=keys.length?keys.map(k=>`<details class="date-group" ${k===today?'open':''}><summary class="date-toggle">${dateLabel(k)} <span>${groups[k].length}件　${k===today?'▼':'＋'}</span></summary>${groups[k].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(x=>x.html).join('')}</details>`).join(''):'<div class="empty">完了履歴はまだありません。</div>';
}
window.undoTaskFromHistory=id=>{const t=tasks.find(x=>x.id===id);if(!t||isParent(t))return;if(!confirm(`「${t.name}」を未完了に戻します。実績が${t.difficulty}pt減少します。よろしいですか？`))return;t.completedAt=null;persist();};
window.undoChildFromHistory=(pid,cid)=>{const p=tasks.find(x=>x.id===pid),c=p?.children?.find(x=>x.id===cid);if(!c||!c.completedAt)return;if(!confirm(`「${c.name}」を未完了に戻します。実績が${c.difficulty}pt減少します。よろしいですか？`))return;c.completedAt=null;p.completedAt=null;p.manualReopen=false;persist();};
window.undoParentFromHistory=id=>{const p=tasks.find(x=>x.id===id);if(!p||!isParent(p))return;if(!confirm(`「${p.name}」を再開します。完了済みサブタスクの状態と実績は保持します。よろしいですか？`))return;p.completedAt=null;p.manualReopen=true;persist();};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:3,exportedAt:now(),retainedAchievement,tasks,templates},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daily_quest_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),incoming=Array.isArray(data)?data:data.tasks;if(!Array.isArray(incoming))throw new Error('invalid');if(!confirm('現在のタスクをバックアップの内容で置き換えますか？'))return;tasks=incoming.map(normalizeTask).filter(t=>t.name);retainedAchievement=Number(data.retainedAchievement)||0;templates=Array.isArray(data.templates)?data.templates.filter(x=>x&&["monthly","daily","weekly"].includes(x.repeat)).map(x=>({id:String(x.id||uid()),name:String(x.name||""),difficulty:level(x.difficulty),repeat:x.repeat,weekday:Number(x.weekday)||0,weekdays:Array.isArray(x.weekdays)?[...new Set(x.weekdays.map(Number).filter(d=>Number.isInteger(d)&&d>=0&&d<=6))]:[Number(x.weekday)||0],startKey:String(x.startKey||""),monthOffset:x.monthOffset===-1?-1:0,generatedKeys:Array.isArray(x.generatedKeys)?x.generatedKeys:[]})):[];persist();resetForm();alert('バックアップを読み込みました。');}catch(err){alert('読み込めませんでした。有効なバックアップJSONを選んでください。');}finally{e.target.value='';}};
// Delegate interactions without compiling task IDs as JavaScript source.
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action,id=el.dataset.id,pid=el.dataset.parentId,cid=el.dataset.childId;
  switch(action){
    case 'delete-template': deleteTemplate(id);break;
    case 'edit-template': editTemplate(id);break;
    case 'edit-task': editTask(id);break;
    case 'open-child-editor': openChildEditor(id);break;
    case 'delete-task': deleteTask(id);break;
    case 'delete-history-task': deleteTask(id,true);break;
    case 'edit-child': editChild(pid,cid);break;
    case 'delete-child': deleteChild(pid,cid);break;
    case 'add-child': addChild(id);break;
    case 'undo-child': undoChildFromHistory(pid,cid);break;
    case 'undo-parent': undoParentFromHistory(id);break;
    case 'undo-task': undoTaskFromHistory(id);break;
    case 'close-modal': closeModal();break;
    case 'modal-backdrop': if(e.target===el)closeModal();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('input[data-action]');
  if(!el)return;
  if(el.dataset.action==='complete-task')completeTask(el.dataset.id,el.checked,el);
  if(el.dataset.action==='toggle-child')toggleChild(el.dataset.parentId,el.dataset.childId,el.checked,el);
});
load();render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});window.addEventListener('focus',()=>render());setInterval(()=>{if(!document.hidden)render();},60000);
